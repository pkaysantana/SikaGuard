[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sika-guard"
version = "0.1.0"
description = "Deterministic foundation for testing independent checks on AI purchasing-agent financial decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sika-guard-eval = "sika_guard.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
